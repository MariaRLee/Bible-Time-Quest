 let gx=s.gate.x*S+S/2, gy=s.gate.y*S+S/2,pulse=(Math.sin(t/370)+1)/2;
 ctx.beginPath();ctx.arc(gx,gy,23+pulse*5,0,Math.PI*2);ctx.fillStyle=hasAll()?'#ffe59432':'#85afcc25';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=hasAll()?'#ffdf9b':'#a5b8bb';ctx.stroke();emoji(s.gate.icon||'🗝️',gx,gy+2,45,'#081925');
 s.items.filter(o=>!picked().includes(o.id)).forEach((o,i)=>{let cx=o.x*S+S/2,cy=o.y*S+S/2+Math.sin(t/430+i*2)*4;ctx.beginPath();ctx.arc(cx,cy,25+Math.sin(t/390+i)*2,0,Math.PI*2);ctx.fillStyle='#ffe4a83b';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#ffdfa2ac';ctx.stroke();emoji(o.icon,cx,cy+1,43,'#10232d');});
 let px=player.x*S+S/2,py=player.y*S+S/2;ctx.beginPath();ctx.ellipse(px,py+19,17,6,0,0,2*Math.PI);ctx.fillStyle='#0515158a';ctx.fill();ctx.beginPath();ctx.arc(px,py-2,24,0,Math.PI*2);ctx.fillStyle='#6be0cc37';ctx.fill();ctx.strokeStyle='#8cffe0';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=GAME.id==='history'?'#ffd295':'#c5f1cf';ctx.beginPath();ctx.arc(px,py-11,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(px,py-3);ctx.lineTo(px-11,py+13);ctx.lineTo(px+11,py+13);ctx.closePath();ctx.fill();ctx.fillStyle='#143c3b';ctx.beginPath();ctx.arc(px,py+2,3,0,Math.PI*2);ctx.fill();ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillStyle='#faf7e7';ctx.fillText(lang==='zh'?'你':'YOU',px,py-34);requestAnimationFrame(canvasFrame);
}
function emoji(t,x,y,size,shadow){ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${size}px "Apple Color Emoji","Segoe UI Emoji",system-ui`;ctx.shadowColor=shadow||'#0005';ctx.shadowBlur=6;ctx.fillText(t,x,y);ctx.restore();}
function fromCanvasPoint(clientX,clientY){let r=cv.getBoundingClientRect();return{x:Math.floor((clientX-r.left)/r.width*COLS),y:Math.floor((clientY-r.top)/r.height*ROWS)};}
let pointerStart=null;
cv.addEventListener('pointerdown',e=>{pointerStart={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointerup',e=>{if(!pointerStart||puzzleActive)return;let dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y;if(Math.hypot(dx,dy)>29){move(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0,Math.abs(dy)>=Math.abs(dx)?Math.sign(dy):0);}else{const p=fromCanvasPoint(e.clientX,e.clientY);autoWalk(p.x,p.y);}pointerStart=null;});
cv.addEventListener('pointercancel',()=>{pointerStart=null;});
const dirPairs={up:[0,-1],left:[-1,0],down:[0,1],right:[1,0]};
document.querySelectorAll('[data-dir]').forEach(b=>{let repeater=null;b.addEventListener('pointerdown',e=>{e.preventDefault();const d=dirPairs[b.dataset.dir];move(...d);repeater=setInterval(()=>move(...d),170);b.setPointerCapture(e.pointerId);});for(const end of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(end,()=>{if(repeater){clearInterval(repeater);repeater=null;}});b.addEventListener('click',e=>{if(e.detail===0)move(...dirPairs[b.dataset.dir]);});});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='Escape'){$('helpOverlay').classList.remove('open');if(puzzleActive){if(puzzleSolved)proceed();else closePuzzle();}return;}if(puzzleActive||$('helpOverlay').classList.contains('open'))return;const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]}[e.key];if(d){e.preventDefault();move(...d);}else if(e.key===' '||e.key==='Enter'){if(e.target===document.body||e.target===cv){e.preventDefault();action();}}});
$('interactBtn').onclick=action;$('hintBtn').onclick=hint;$('helpBtn').onclick=showHelp;$('zhBtn').onclick=()=>setLanguage('zh');$('enBtn').onclick=()=>setLanguage('en');$('resetBtn').onclick=()=>{if(confirm(trans('confirmReset'))){save={current:0,completed:[false,false,false],pickups:{},lang};persist();$('finishedOverlay').classList.remove('open');closePuzzle();loadStage();}};
function showHelp(){$('helpTitle').textContent=trans('helpTitle');$('helpText').innerHTML=trans('helpBody');$('okayHelp').textContent=trans('okay');$('helpOverlay').classList.add('open');}
$('closeHelp').onclick=$('okayHelp').onclick=()=>$('helpOverlay').classList.remove('open');
function openPuzzle(){if(puzzleActive)return;stopAuto();puzzleActive=true;puzzleSolved=false;pAssignments=[];selectedToken=null;portionSelected=[];dialAngle=0;routePath=[20];$('puzzleOverlay').classList.add('open');renderPuzzle();}
function closePuzzle(){puzzleActive=false;$('puzzleOverlay').classList.remove('open');$('puzzleStatus').textContent='';}
$('closePuzzle').onclick=closePuzzle;
function puzzleInfo(){const p=stage().puzzle;$('modalEyebrow').textContent=trans('puzzle')+' · '+(index+1)+'/3';$('modalTitle').textContent=L(p.title);$('puzzleInstruction').textContent=L(p.instructions);$('resetPuzzle').textContent=trans('retry');$('checkPuzzle').textContent=trans('check');$('resetPuzzle').style.display='';$('checkPuzzle').style.display='';$('puzzleStatus').textContent='';}
function renderPuzzle(){if(!puzzleActive)return;puzzleInfo();let p=stage().puzzle;switch(p.kind){case 'order':case 'match':renderArrange(p);break;case 'route':renderRoute();break;case 'portion':renderPortion();break;case 'dial':renderDial();break;}}
function renderArrange(p){let tokens=p.tokens; if(!pAssignments.length)pAssignments=Array(p.expected.length).fill(null);$('puzzleBody').innerHTML=`<div class="puzzle-board"><div class="p-slots">${p.expected.map((id,i)=>{let v=pAssignments[i],t=tokens.find(t=>t.id===v);return `<button type="button" class="p-slot ${v?'occupied':''}" data-slot="${i}"><small>${i+1}</small><span class="icon">${t?t.icon:'＋'}</span><b>${t?escapeHTML(L(t.label)):escapeHTML(L(p.slots[i]))}</b></button>`;}).join('')}</div><div class="p-tray">${tokens.filter(t=>!pAssignments.includes(t.id)).map(t=>`<button type="button" class="p-token ${selectedToken===t.id?'selected':''}" data-token="${t.id}">${t.icon} ${escapeHTML(L(t.label))}</button>`).join('')}</div></div><p style="font-size:12px;color:#cde1da">${trans('tapBack')}</p>`;}
function assign(slot){if(!selectedToken){if(pAssignments[slot]){selectedToken=pAssignments[slot];pAssignments[slot]=null;renderArrange(stage().puzzle);}return;}if(pAssignments.includes(selectedToken)){let old=pAssignments.indexOf(selectedToken);pAssignments[old]=null;}pAssignments[slot]=selectedToken;selectedToken=null;renderArrange(stage().puzzle);}
$('puzzleBody').addEventListener('click',e=>{let token=e.target.closest('[data-token]'),slot=e.target.closest('[data-slot]');if(token){if(Date.now()-lastDragEnd<250)return;selectedToken=token.dataset.token;renderArrange(stage().puzzle);$('puzzleStatus').textContent=trans('selected');}else if(slot)assign(Number(slot.dataset.slot));else if(e.target.closest('[data-manna]')){const id=Number(e.target.closest('[data-manna]').dataset.manna);togglePortion(id);}else if(e.target.closest('[data-basket-item]')){togglePortion(Number(e.target.closest('[data-basket-item]').dataset.basketItem));}else if(e.target.closest('[data-route]')){routeSelect(Number(e.target.closest('[data-route]').dataset.route));}});
let lastDragEnd=0;
$('puzzleBody').addEventListener('pointerdown',e=>{const el=e.target.closest('[data-token],[data-manna]');if(!el)return;dragState={id:el.dataset.token??Number(el.dataset.manna),type:el.dataset.token?'token':'manna',x:e.clientX,y:e.clientY,ghost:null};});
window.addEventListener('pointermove',e=>{if(!dragState)return;let ds=dragState;if(!ds.ghost&&Math.hypot(e.clientX-ds.x,e.clientY-ds.y)>10){let g=document.createElement('div');g.className='p-token ghost';g.textContent=ds.type==='manna'?'🍞':L((stage().puzzle.tokens||[]).find(t=>t.id===ds.id)?.label);document.body.appendChild(g);ds.ghost=g;}if(ds.ghost){ds.ghost.style.left=e.clientX+'px';ds.ghost.style.top=e.clientY+'px';}});
window.addEventListener('pointerup',e=>{if(!dragState)return;let ds=dragState;if(ds.ghost){ds.ghost.remove();const hit=document.elementFromPoint(e.clientX,e.clientY);if(ds.type==='token'){const target=hit?.closest('[data-slot]');if(target){selectedToken=ds.id;assign(Number(target.dataset.slot));$('puzzleStatus').textContent=trans('oneOf')+pAssignments.filter(Boolean).length+'/'+pAssignments.length;}}else if(ds.type==='manna'&&hit?.closest('#basket')){togglePortion(ds.id);}lastDragEnd=Date.now();}dragState=null;});
function renderRoute(){const p=stage().puzzle;const water=new Set(p.water);$('puzzleBody').innerHTML=`<div class="puzzle-board"><div class="route-grid" id="routeGrid">${Array.from({length:25},(_,i)=>`<button type="button" class="route-cell ${water.has(i)?'water':''} ${routePath.includes(i)?'visited':''} ${i===20?'start':''} ${i===4?'end':''}" data-route="${i}" aria-label="Tile ${i+1}">${i===20?'🌿':i===4?'🚢':water.has(i)?'🌊':routePath.includes(i)?'•':''}</button>`).join('')}</div><p style="font-size:12px;color:#d5e8e5;text-align:center">${trans('routeInstruction')}</p></div>`;
const grid=$('routeGrid');grid.addEventListener('pointerdown',e=>{routeDragging=true;grid.setPointerCapture(e.pointerId);const id=routeIndexAt(e.clientX,e.clientY);if(id!==null)routeSelect(id);});grid.addEventListener('pointermove',e=>{if(!routeDragging)return;const id=routeIndexAt(e.clientX,e.clientY);if(id!==null)routeSelect(id);});grid.addEventListener('pointerup',()=>routeDragging=false);grid.addEventListener('pointercancel',()=>routeDragging=false);}
function routeIndexAt(x,y){const grid=$('routeGrid');if(!grid)return null;const r=grid.getBoundingClientRect();if(x<r.left||x>r.right||y<r.top||y>r.bottom)return null;let first=grid.querySelector('[data-route]');if(!first)return null;let cols=5,gap=parseFloat(getComputedStyle(grid).gap)||0,cell=first.getBoundingClientRect().width;let col=Math.floor((x-r.left)/(cell+gap)),row=Math.floor((y-r.top)/(cell+gap));return col>=0&&col<5&&row>=0&&row<5?row*5+col:null;}
function routeSelect(id){let p=stage().puzzle;if(p.kind!=='route'||puzzleSolved)return;if(routePath.length===1&&id===20)return;let old=routePath[routePath.length-1];if(routePath.length>=2&&id===routePath[routePath.length-2]){routePath.pop();updateRouteCells();return;}if(Math.abs(Math.floor(id/5)-Math.floor(old/5))+Math.abs(id%5-old%5)!==1){$('puzzleStatus').textContent=trans('routeNext');return;}if(p.water.includes(id)){$('puzzleStatus').textContent=trans('routeWrong');return;}if(routePath.includes(id))return;routePath.push(id);updateRouteCells();if(id===4){$('puzzleStatus').textContent=trans('routeDone');completeStage();}}
function updateRouteCells(){const grid=$('routeGrid');if(!grid)return;grid.querySelectorAll('[data-route]').forEach(e=>{let id=Number(e.dataset.route);e.classList.toggle('visited',routePath.includes(id));if(id!==20&&id!==4&&!stage().puzzle.water.includes(id))e.textContent=routePath.includes(id)?'•':'';});}
function togglePortion(id){const j=portionSelected.indexOf(id);if(j===-1)portionSelected.push(id);else portionSelected.splice(j,1);renderPortion();}
function renderPortion(){const p=stage().puzzle;$('puzzleBody').innerHTML=`<div class="puzzle-board portion-board"><div class="manna-source">${Array.from({length:7},(_,i)=>`<button type="button" class="manna-piece ${portionSelected.includes(i)?'placed':''}" data-manna="${i}" ${portionSelected.includes(i)?'disabled':''} aria-label="Manna ${i+1}">🍞</button>`).join('')}</div><div id="basket" class="basket"><div class="big">🧺</div><strong>${portionSelected.length} / 4</strong><div>${portionSelected.map(i=>`<button class="manna-piece" style="width:33px;height:33px;font-size:17px" data-basket-item="${i}" aria-label="Remove manna ${i+1}">🍞</button>`).join('')}</div></div></div><p style="font-size:12px;color:#cde1da">${trans('four')}</p>`;}
function normalizeAngle(a){return(a%360+360)%360;}
function dialPointerAngle(e){const r=$('dialFace').getBoundingClientRect();return normalizeAngle(Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI+90);}
function renderDial(){const p=stage().puzzle;$('puzzleBody').innerHTML=`<div class="puzzle-board" style="text-align:center"><div id="dialFace" style="position:relative;touch-action:none;margin:0 auto 14px;width:230px;height:230px;border-radius:50%;border:10px solid #b89969;background:repeating-conic-gradient(#ffffff12 0deg 2deg, transparent 2deg 30deg),radial-gradient(circle,#2a5a61,#142a3e);box-shadow:0 0 35px #ffcb6a33;cursor:grab"><div id="starTarget" style="position:absolute;font-size:35px;left:50%;top:50%;transform:translate(-50%,-50%)">⭐</div><div id="dialNeedle" style="position:absolute;left:50%;top:50%;transform-origin:50% 100%;width:6px;height:95px;border-radius:9px;background:linear-gradient(#ffeaa8,#fc9d44);box-shadow:0 0 19px #ffe88a;transform:translate(-50%,-100%) rotate(0deg)"></div><div style="position:absolute;left:50%;top:50%;width:16px;height:16px;background:#fff3c6;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 15px #ffeaa8"></div></div><input id="dialSlider" type="range" min="0" max="359" step="1" value="${dialAngle}" style="width:min(100%,360px);accent-color:#ffe0a5" aria-label="Rotate light beam"><div id="dialOutput" style="font-size:13px;margin:9px;color:#dce9e7"></div></div>`;
let face=$('dialFace'),active=false;face.addEventListener('pointerdown',e=>{active=true;face.setPointerCapture(e.pointerId);dialAngle=dialPointerAngle(e);updateDial();});face.addEventListener('pointermove',e=>{if(active){dialAngle=dialPointerAngle(e);updateDial();}});face.addEventListener('pointerup',()=>{active=false;maybeSolveDial();});face.addEventListener('pointercancel',()=>active=false);$('dialSlider').addEventListener('input',e=>{dialAngle=Number(e.target.value);updateDial();});$('dialSlider').addEventListener('change',maybeSolveDial);updateDial();}
function updateDial(){let p=stage().puzzle;const face=$('dialFace'),t=$('starTarget');if(!face)return;let a=(p.target-90)*Math.PI/180;t.style.left=(50+37*Math.cos(a))+'%';t.style.top=(50+37*Math.sin(a))+'%';$('dialNeedle').style.transform=`translate(-50%,-100%) rotate(${dialAngle}deg)`;$('dialSlider').value=dialAngle;$('dialOutput').textContent='↻ '+Math.round(dialAngle)+'°';}
function dialDistance(a,b){return Math.abs((a-b+540)%360-180)}
function maybeSolveDial(){if(dialDistance(dialAngle,stage().puzzle.target)<=12)completeStage();}
function checkAnswer(){let p=stage().puzzle;if(puzzleSolved){proceed();return;}if(p.kind==='order'||p.kind==='match'){if(p.expected.every((id,i)=>pAssignments[i]===id))completeStage();else $('puzzleStatus').textContent=trans('notQuite');}else if(p.kind==='route'){$('puzzleStatus').textContent=trans('routeNext');}else if(p.kind==='portion'){if(portionSelected.length===4)completeStage();else $('puzzleStatus').textContent=trans(portionSelected.length<4?'portionShort':'portionOver');}else if(p.kind==='dial'){if(dialDistance(dialAngle,p.target)<=12)completeStage();else $('puzzleStatus').textContent=trans('dialHelp');}}
function completeStage(){if(puzzleSolved)return;puzzleSolved=true;save.completed[index]=true;save.current=Math.max(save.current,index+1);persist();drawUI();let p=stage().puzzle;$('modalEyebrow').textContent='🏆 '+trans('winLine');$('modalTitle').textContent=L(p.winTitle);$('puzzleInstruction').textContent=L(p.winText);$('puzzleBody').innerHTML=`<div class="completed"><div class="big">${p.reward}</div><h2>${escapeHTML(L(p.rewardName))}</h2><p>${escapeHTML(trans('allGood'))} ${escapeHTML(L(p.rewardName))}</p></div>`;$('puzzleStatus').textContent='✓';$('resetPuzzle').style.display='none';$('checkPuzzle').textContent=index===2?trans('finish'):trans('next');$('closePuzzle').style.display='none';}
function proceed(){let done=index===2;closePuzzle();$('closePuzzle').style.display='';if(done)openFinished();else loadStage();}
function resetPuzzle(){if(puzzleSolved)return;pAssignments=[];selectedToken=null;routePath=[20];portionSelected=[];dialAngle=0;renderPuzzle();}
$('checkPuzzle').onclick=checkAnswer;$('resetPuzzle').onclick=resetPuzzle;
function openFinished(){$('finishedTitle').textContent=trans('finished');$('finishedDesc').textContent=L(GAME.ending);$('summaryTreasures').innerHTML=st.map(s=>`<span title="${escapeHTML(L(s.puzzle.rewardName))}">${s.puzzle.reward}</span>`).join('');$('playAgain').textContent=trans('again');$('finishedOverlay').classList.add('open');}
$('playAgain').onclick=()=>{save={current:0,completed:[false,false,false],pickups:{},lang};persist();$('finishedOverlay').classList.remove('open');loadStage();};
loadStage();requestAnimationFrame(canvasFrame);
})();
</script></body></html>
